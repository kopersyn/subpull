[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subpull"
version = "0.2.0"
description = "Manual, safe downloader for astrophotography frames on SFTP servers, organized per object."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.2",
    "PySide6-Essentials>=6.6",
]
keywords = ["astrophotography", "fits", "sftp", "downloader", "nina", "remote observatory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/kopersyn/subpull"

[project.gui-scripts]
subpull = "subpull.ui.app:main"

[tool.setuptools.packages.find]
include = ["subpull*"]

[tool.setuptools.package-data]
"subpull.ui" = ["assets/*.svg"]
